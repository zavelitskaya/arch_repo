{% extends 'repository/base.html' %}

{% block content %}
<h1>Компоненты</h1>
<div class="components-grid">
    {% for c in components %}
    <div class="component-card">
        <h3>{{ c.name }}</h3>
        <p><span class="badge">{{ c.component_type }}</span></p>
        <p>{{ c.system.name }}</p>
        <p style="font-size: 0.75rem; color: #94a3b8;">{{ c.technical_owner|default:"—" }}</p>
        <a href="/components/{{ c.id }}/" class="link" style="display: inline-block; margin-top: 0.5rem;">Подробнее →</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
