<div id="diagram" style="width: 100%; height: 500px; background: #f8fafc; border-radius: 8px;"></div>
<p style="font-size: 0.75rem; color: #64748b; margin-top: 1rem; text-align: center;">
    💡 Наведите на узел для деталей. Можно перетаскивать и масштабировать.
</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
<script>
    function renderDiagram(stepsData) {
        if (!stepsData || stepsData.length === 0) {
            document.getElementById('diagram').innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #64748b;">Нет шагов для отображения</div>';
            return;
        }
        
        const nodes = [];
        const edges = [];
        
        for (let i = 0; i < stepsData.length; i++) {
            const step = stepsData[i];
            
            let label = 'Шаг ' + step.step_order + '\n';
            if (step.step_type === 'ordinary') {
                label += step.interaction_name || 'Обычный шаг';
            } else {
                label += 'Ветвление';
            }
            
            const color = step.step_type === 'condition' ? '#fef3c7' : '#dbeafe';
            const borderColor = step.step_type === 'condition' ? '#f59e0b' : '#3b82f6';
            
            nodes.push({
                id: step.id,
                label: label,
                title: step.step_type === 'ordinary' ? step.interaction_name : step.condition_expression,
                color: {
                    background: color,
                    border: borderColor
                },
                shape: 'box',
                font: { size: 12, align: 'center' }
            });
            
            if (step.step_type === 'ordinary') {
                const nextStep = stepsData.find(s => s.step_order === step.step_order + 1);
                if (nextStep) {
                    edges.push({
                        from: step.id,
                        to: nextStep.id,
                        arrows: 'to',
                        smooth: { type: 'cubicBezier' }
                    });
                }
            } else if (step.step_type === 'condition') {
                if (step.true_next_step_id) {
                    edges.push({
                        from: step.id,
                        to: step.true_next_step_id,
                        label: 'ИСТИНА',
                        arrows: 'to',
                        color: { color: '#10b981' },
                        font: { align: 'top', size: 10 }
                    });
                }
                if (step.false_next_step_id) {
                    edges.push({
                        from: step.id,
                        to: step.false_next_step_id,
                        label: 'ЛОЖЬ',
                        arrows: 'to',
                        color: { color: '#ef4444' },
                        font: { align: 'top', size: 10 }
                    });
                }
            }
        }
        
        const container = document.getElementById('diagram');
        const data = {
            nodes: new vis.DataSet(nodes),
            edges: new vis.DataSet(edges)
        };
        const options = {
            nodes: {
                margin: 10,
                widthConstraint: { minimum: 100, maximum: 200 },
                heightConstraint: { minimum: 50 }
            },
            edges: {
                smooth: { type: 'cubicBezier', roundness: 0.5 }
            },
            physics: {
                enabled: true,
                stabilization: { iterations: 100 }
            },
            layout: {
                hierarchical: {
                    enabled: true,
                    direction: 'LR',
                    levelSeparation: 150,
                    nodeSpacing: 100
                }
            }
        };
        
        new vis.Network(container, data, options);
    }
</script>
